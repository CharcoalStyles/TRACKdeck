[project]
name = "TRACKdeck"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "apscheduler>=3.10.4",
    "pyyaml>=6.0.2",
    "watchfiles>=0.24.0",
    "chromadb>=0.5.0",
    "fastapi[standard]>=0.136.3",
    "faster-whisper>=1.2.1",
    "httpx>=0.28.1",
    "langchain-core>=1.4.2",
    "langchain-openai>=1.2.2",
    "langgraph>=1.2.4",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "piper-tts>=1.4.2",
    "pydantic>=2.13.4",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.32",
    "uvicorn>=0.49.0",
    "itsdangerous>=2.2.0",
    "python-dateutil>=2.9.0.post0",
    "langchain-mcp-adapters>=0.3.1",
    "mcp>=1.24.0,<2.0.0",
    "trafilatura>=2.2.0",
    "langchain-google-genai>=4.4.0",
    # Listed directly (not just pulled in transitively via pydecide[laya]
    # below) so the [tool.uv.sources] CPU-index redirect below actually
    # takes effect — uv didn't honor it for torch two extras-levels deep
    # (pydecide[laya] -> laya -> torch) until torch became a direct
    # top-level requirement too. See that block's comment for why the
    # redirect matters at all.
    "torch>=2.0.0",
    "pydecide[laya]>=0.1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "freezegun>=1.5.0",
]

[tool.pytest.ini_options]
# Restrict discovery to the real suite. Without this, pytest's default
# *_test.py/test_*.py collection pattern also matches throwaway scripts
# under scratchpad/ (e.g. run_single_test.py) and tries to import/execute
# them as test modules.
testpaths = ["tests"]

[tool.uv.sources]
# pydecide[laya] pulls in torch as a transitive dependency. PyPI's own
# torch wheels for Linux are CUDA-enabled (multi-GB) regardless of
# whether a GPU is present — every box this app actually runs on is
# CPU-only (see utils/laya_client.py's docstring / scratchpad/'s Phase B
# notes), so redirect torch specifically to PyTorch's own CPU-only wheel
# index instead of PyPI's default.
torch = { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
