<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Dos — TRACKdeck</title>
  <link rel="stylesheet" href="/static/css/theme.css">
</head>

<body>

  <header id="appHeader"></header>

  <main>
    <div class="card">
      <h2>Upcoming To-Dos</h2>
      <p class="description">Reminders you've set via voice or chat — edit or cancel them here.</p>
      <div class="field-row"><button type="button" id="refreshBtn" class="secondary-btn">Refresh</button></div>
      <div class="save-status" id="remindersStatus"></div>
    </div>

    <div id="remindersList"></div>
  </main>

  <script type="module">
    import { listReminders, updateReminder, deleteReminder } from '/static/js/api.js';
    import { requireSession } from '/static/js/auth.js';
    import { renderNav } from '/static/js/nav.js';

    renderNav('reminders');

    if (await requireSession()) {
      const refreshBtn = document.getElementById('refreshBtn');
      const remindersStatus = document.getElementById('remindersStatus');
      const remindersList = document.getElementById('remindersList');

      const editingIds = new Set();
      let reminders = [];

      function showStatus(text, ok = true) {
        remindersStatus.textContent = text;
        remindersStatus.style.color = ok ? '#00adb5' : '#ff6b6b';
      }

      function formatDue(epochSeconds) {
        return new Date(epochSeconds * 1000).toLocaleString([], {
          weekday: 'short', year: 'numeric', month: 'short', day: 'numeric',
          hour: '2-digit', minute: '2-digit',
        });
      }

      // <input type="datetime-local"> wants "YYYY-MM-DDTHH:MM" in the
      // browser's local time — the assistant's system prompt already
      // grounds voice/chat reminders in the user's local timezone the
      // same way, so no separate timezone handling is needed here.
      function toDatetimeLocalValue(epochSeconds) {
        const d = new Date(epochSeconds * 1000);
        const pad = (n) => String(n).padStart(2, '0');
        return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
      }

      function renderReadCard(reminder) {
        const card = document.createElement('div');
        card.className = 'card';

        const heading = document.createElement('h2');
        heading.textContent = reminder.message;

        const due = document.createElement('p');
        due.className = 'description';
        due.textContent = `Due ${formatDue(reminder.due_at)}`;

        const actions = document.createElement('div');
        actions.className = 'field-row';

        const editBtn = document.createElement('button');
        editBtn.type = 'button';
        editBtn.className = 'secondary-btn';
        editBtn.textContent = 'Edit';
        editBtn.addEventListener('click', () => {
          editingIds.add(reminder.id);
          render();
        });

        const deleteBtn = document.createElement('button');
        deleteBtn.type = 'button';
        deleteBtn.className = 'secondary-btn';
        deleteBtn.textContent = 'Delete';
        deleteBtn.addEventListener('click', async () => {
          showStatus('Deleting...', true);
          try {
            await deleteReminder(reminder.id);
            await loadReminders();
          } catch (error) {
            console.error('Failed to delete reminder:', error);
            showStatus('Failed to delete.', false);
          }
        });

        actions.appendChild(editBtn);
        actions.appendChild(deleteBtn);

        card.appendChild(heading);
        card.appendChild(due);
        card.appendChild(actions);
        return card;
      }

      function renderEditCard(reminder) {
        const card = document.createElement('div');
        card.className = 'card';

        const messageRow = document.createElement('div');
        messageRow.className = 'field-row';
        const messageLabel = document.createElement('label');
        messageLabel.textContent = 'Message';
        const messageInput = document.createElement('input');
        messageInput.type = 'text';
        messageInput.value = reminder.message;
        messageRow.appendChild(messageLabel);
        messageRow.appendChild(messageInput);

        const dueRow = document.createElement('div');
        dueRow.className = 'field-row';
        const dueLabel = document.createElement('label');
        dueLabel.textContent = 'Due';
        const dueInput = document.createElement('input');
        dueInput.type = 'datetime-local';
        dueInput.value = toDatetimeLocalValue(reminder.due_at);
        dueRow.appendChild(dueLabel);
        dueRow.appendChild(dueInput);

        const actions = document.createElement('div');
        actions.className = 'field-row';

        const saveBtn = document.createElement('button');
        saveBtn.type = 'button';
        saveBtn.className = 'primary-btn';
        saveBtn.textContent = 'Save';
        saveBtn.addEventListener('click', async () => {
          showStatus('Saving...', true);
          try {
            await updateReminder(reminder.id, { message: messageInput.value, due_at: dueInput.value });
            editingIds.delete(reminder.id);
            await loadReminders();
          } catch (error) {
            console.error('Failed to save reminder:', error);
            showStatus('Failed to save.', false);
          }
        });

        const cancelBtn = document.createElement('button');
        cancelBtn.type = 'button';
        cancelBtn.className = 'secondary-btn';
        cancelBtn.textContent = 'Cancel';
        cancelBtn.addEventListener('click', () => {
          editingIds.delete(reminder.id);
          render();
        });

        actions.appendChild(saveBtn);
        actions.appendChild(cancelBtn);

        card.appendChild(messageRow);
        card.appendChild(dueRow);
        card.appendChild(actions);
        return card;
      }

      function render() {
        remindersList.replaceChildren();
        if (reminders.length === 0) {
          const empty = document.createElement('div');
          empty.className = 'card';
          empty.innerHTML = '<p class="description" style="margin:0;">No upcoming to-dos.</p>';
          remindersList.appendChild(empty);
          return;
        }
        for (const reminder of reminders) {
          remindersList.appendChild(
            editingIds.has(reminder.id) ? renderEditCard(reminder) : renderReadCard(reminder)
          );
        }
      }

      async function loadReminders() {
        showStatus('Loading...', true);
        try {
          ({ reminders } = await listReminders());
          render();
          showStatus('', true);
        } catch (error) {
          console.error('Failed to load reminders:', error);
          showStatus('Failed to load.', false);
        }
      }

      refreshBtn.addEventListener('click', loadReminders);
      loadReminders();
    }
  </script>
</body>

</html>
