<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Check-in — Assistant Dashboard</title>
  <link rel="stylesheet" href="/static/css/theme.css">
  <style>
    /* Deliberately not importing api.js or chat.js on this page — it's
       opened by an anonymous link tap (see jobs/checkin.py's
       answer_checkin docstring for the magic-link trust model), and
       those modules' fetches require a logged-in session (see
       static/js/auth.js), which this page must never assume or need. */
    #replyInput {
      width: 100%;
      min-height: 5rem;
      background: #252525;
      border: 1px solid #333;
      color: #e0e0e0;
      padding: 0.6rem 0.7rem;
      border-radius: 8px;
      font-size: 0.95rem;
      font-family: inherit;
      resize: vertical;
      box-sizing: border-box;
    }

    .checkin-actions {
      display: flex;
      gap: 0.6rem;
      align-items: center;
      margin-top: 0.75rem;
      flex-wrap: wrap;
    }

    #voiceStatus {
      font-size: 0.85rem;
      color: #aaa;
      margin-top: 0.5rem;
    }
  </style>
</head>

<body>

  <header>
    <h1>Assistant Dashboard</h1>
  </header>

  <main>
    <div class="card">
      <h2>Check-in <span id="categoryBadge"></span></h2>
      <p class="description" id="promptText">Loading…</p>

      <div id="replyArea">
        <textarea id="replyInput" placeholder="Type your reply..."></textarea>
        <div class="checkin-actions">
          <button type="button" id="sendBtn" class="primary-btn">Send</button>
          <button type="button" id="recordBtn" class="mic-btn">Or record a voice reply</button>
          <button type="button" id="skipBtn" class="secondary-btn">Skip this one</button>
        </div>
        <div id="voiceStatus"></div>
      </div>

      <div id="doneMessage" class="description" style="display:none;"></div>
    </div>
  </main>

  <script type="module">
    // Recorder makes no network calls of its own (unlike transcribeAudio/
    // attachVoiceButton in the same module), so it's safe to import here
    // despite this page's no-session, magic-link trust model — see the
    // comment on #replyInput above for why api.js/chat.js/auth.js are not.
    import { Recorder } from '/static/js/voiceInput.js';

    const params = new URLSearchParams(location.search);
    const checkinId = params.get('id');
    const category = params.get('category') || '';
    const promptText = params.get('prompt_text') || '(no prompt text provided)';

    document.getElementById('categoryBadge').textContent = category ? `(${category})` : '';
    document.getElementById('promptText').textContent = promptText;

    const replyArea = document.getElementById('replyArea');
    const doneMessage = document.getElementById('doneMessage');
    const replyInput = document.getElementById('replyInput');
    const sendBtn = document.getElementById('sendBtn');
    const skipBtn = document.getElementById('skipBtn');
    const recordBtn = document.getElementById('recordBtn');
    const voiceStatus = document.getElementById('voiceStatus');

    function finish(message) {
      replyArea.style.display = 'none';
      doneMessage.textContent = message;
      doneMessage.style.display = 'block';
    }

    const STATUS_MESSAGES = {
      answered: "You've already replied to this check-in.",
      skipped: 'You already skipped this check-in.',
      expired: 'This check-in has expired.',
    };

    async function alreadyResolved() {
      try {
        const response = await fetch(`/checkin/${encodeURIComponent(checkinId)}/status`);
        if (response.status === 404) {
          finish('This check-in link is no longer valid.');
          return true;
        }
        if (!response.ok) return false; // can't tell — fall through and let the form's own submit checks catch it
        const data = await response.json();
        if (!data.awaiting_response) {
          finish(STATUS_MESSAGES[data.status] || 'This check-in is no longer awaiting a reply.');
          return true;
        }
        return false;
      } catch (err) {
        console.error('Status check failed:', err);
        return false;
      }
    }

    if (!checkinId) {
      finish('No check-in id in the link — nothing to reply to.');
    } else if (await alreadyResolved()) {
      // finish() already called inside alreadyResolved()
    } else {
      sendBtn.addEventListener('click', async () => {
        const text = replyInput.value.trim();
        if (!text) return;
        sendBtn.disabled = true;
        sendBtn.textContent = 'Sending…';
        try {
          const response = await fetch(`/checkin/${encodeURIComponent(checkinId)}/reply`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text }),
          });
          if (!response.ok) throw new Error(`Server returned ${response.status}`);
          finish('Thanks — reply sent.');
        } catch (err) {
          console.error('Reply failed:', err);
          sendBtn.disabled = false;
          sendBtn.textContent = 'Send';
          voiceStatus.textContent = 'Could not send — this check-in may have expired.';
        }
      });

      skipBtn.addEventListener('click', async () => {
        skipBtn.disabled = true;
        skipBtn.textContent = 'Skipping…';
        try {
          const response = await fetch(`/checkin/${encodeURIComponent(checkinId)}/skip`, { method: 'POST' });
          if (!response.ok) throw new Error(`Server returned ${response.status}`);
          finish('Skipped.');
        } catch (err) {
          console.error('Skip failed:', err);
          skipBtn.disabled = false;
          skipBtn.textContent = 'Skip this one';
          voiceStatus.textContent = 'Could not skip — this check-in may have expired.';
        }
      });

      // Voice reply — posts to the magic-link endpoint below, no auth header.
      const recorder = new Recorder();

      recordBtn.addEventListener('click', async () => {
        if (!recorder.isRecording) {
          try {
            await recorder.start();
            recordBtn.textContent = 'Stop recording';
            recordBtn.classList.add('recording');
            voiceStatus.textContent = 'Listening...';
          } catch (err) {
            console.error('Microphone access denied or unsupported:', err);
            voiceStatus.textContent = 'Error: Mic access denied.';
          }
        } else {
          recordBtn.textContent = 'Or record a voice reply';
          recordBtn.classList.remove('recording');
          voiceStatus.textContent = 'Processing...';
          const blob = await recorder.stop();
          await sendVoiceReply(blob);
        }
      });

      async function sendVoiceReply(blob) {
        const formData = new FormData();
        formData.append('file', blob, 'checkin-reply.webm');

        try {
          const response = await fetch(`/checkin/${encodeURIComponent(checkinId)}/voice`, {
            method: 'POST',
            body: formData,
          });
          if (!response.ok) throw new Error(`Server returned ${response.status}`);
          const data = await response.json();
          if (!data.transcription) {
            voiceStatus.textContent = 'No speech detected — try again.';
            return;
          }
          finish(`Thanks — heard: "${data.transcription}"`);
        } catch (err) {
          console.error('Voice reply failed:', err);
          voiceStatus.textContent = 'Error sending voice reply.';
        }
      }
    }
  </script>
</body>

</html>
