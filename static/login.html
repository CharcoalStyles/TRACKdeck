<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in — TRACKdeck</title>
  <link rel="stylesheet" href="/static/css/theme.css">
</head>

<body>
  <!-- Deliberately not importing api.js or chat.js on this page — same
       reasoning as static/checkin.html: this is the one page reachable
       before any session exists, so it can't rely on the session-gated
       fetches those modules make. -->

  <header>
    <h1>TRACKdeck</h1>
  </header>

  <main>
    <div class="card">
      <h2>Log in</h2>
      <div class="field-row">
        <label for="passwordInput">Password</label>
        <input type="password" id="passwordInput" autocomplete="current-password">
      </div>
      <button type="button" id="loginBtn" class="primary-btn">Log in</button>
      <div class="save-status" id="loginStatus"></div>
    </div>
  </main>

  <script type="module">
    const passwordInput = document.getElementById('passwordInput');
    const loginBtn = document.getElementById('loginBtn');
    const statusEl = document.getElementById('loginStatus');

    async function attemptLogin() {
      const password = passwordInput.value;
      if (!password) return;
      loginBtn.disabled = true;
      statusEl.textContent = '';
      statusEl.classList.remove('error');
      try {
        const response = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password }),
        });
        if (!response.ok) {
          throw new Error(response.status === 401 ? 'Incorrect password' : `Server returned ${response.status}`);
        }
        location.replace('/');
      } catch (err) {
        console.error('Login failed:', err);
        statusEl.textContent = err.message || 'Login failed — try again.';
        statusEl.classList.add('error');
        loginBtn.disabled = false;
      }
    }

    loginBtn.addEventListener('click', attemptLogin);
    passwordInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') attemptLogin();
    });
  </script>
</body>

</html>
