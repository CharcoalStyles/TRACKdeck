<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vault — TRACKdeck</title>
  <link rel="stylesheet" href="/static/css/theme.css">
</head>

<body>

  <header id="appHeader"></header>

  <main>
    <div class="card">
      <h2>Vault</h2>
      <p class="description">
        Read-only browse of the notes vault — everything the assistant has accumulated, without opening Obsidian.
        Inbox items aren't shown here; they're unprocessed until reconciled into a real note.
      </p>

      <div class="field-row">
        <label for="searchInput">Search</label>
        <input type="text" id="searchInput" placeholder="Title, tag, or excerpt...">
      </div>

      <div class="filter-row">
        <select id="projectFilter">
          <option value="">All projects</option>
        </select>
      </div>
    </div>

    <div id="detailContainer"></div>
    <div id="listContainer"></div>
  </main>

  <script type="module">
    import { listVaultNotes, getVaultNote } from '/static/js/api.js';
    import { requireSession } from '/static/js/auth.js';
    import { renderNav } from '/static/js/nav.js';

    renderNav('vault');

    if (await requireSession()) {
      const searchInput = document.getElementById('searchInput');
      const projectFilter = document.getElementById('projectFilter');
      const detailContainer = document.getElementById('detailContainer');
      const listContainer = document.getElementById('listContainer');

      let notes = [];

      function formatDate(iso) {
        if (!iso) return '—';
        return new Date(iso).toLocaleString();
      }

      function renderNoteCard(note) {
        const card = document.createElement('div');
        card.className = 'card';
        card.style.cursor = 'pointer';

        const heading = document.createElement('h2');
        heading.textContent = note.title;
        card.appendChild(heading);

        const meta = document.createElement('p');
        meta.className = 'description';
        meta.style.margin = '0 0 0.5rem 0';
        meta.style.fontSize = '0.8rem';
        const metaBits = [];
        if (note.project) metaBits.push(`project: ${note.project}`);
        if (note.tags.length > 0) metaBits.push(`tags: ${note.tags.join(', ')}`);
        metaBits.push(`updated ${formatDate(note.updated)}`);
        meta.textContent = metaBits.join('  ·  ');
        card.appendChild(meta);

        if (note.excerpt) {
          const excerpt = document.createElement('p');
          excerpt.className = 'description';
          excerpt.style.margin = '0';
          excerpt.textContent = note.excerpt;
          card.appendChild(excerpt);
        }

        card.addEventListener('click', () => openDetail(note.id));
        return card;
      }

      function renderList() {
        const query = searchInput.value.trim().toLowerCase();
        const project = projectFilter.value;

        const filtered = notes.filter((note) => {
          if (project && note.project !== project) return false;
          if (!query) return true;
          const haystack = `${note.title} ${note.tags.join(' ')} ${note.excerpt}`.toLowerCase();
          return haystack.includes(query);
        });

        listContainer.replaceChildren();
        if (filtered.length === 0) {
          const empty = document.createElement('p');
          empty.className = 'description';
          empty.textContent = 'No notes match.';
          listContainer.appendChild(empty);
          return;
        }
        for (const note of filtered) {
          listContainer.appendChild(renderNoteCard(note));
        }
      }

      async function openDetail(id) {
        detailContainer.replaceChildren();
        const card = document.createElement('div');
        card.className = 'card';
        card.textContent = 'Loading...';
        detailContainer.appendChild(card);
        window.scrollTo({ top: 0, behavior: 'smooth' });

        try {
          const note = await getVaultNote(id);
          card.replaceChildren();

          const closeBtn = document.createElement('button');
          closeBtn.type = 'button';
          closeBtn.className = 'secondary-btn';
          closeBtn.textContent = 'Close';
          closeBtn.style.float = 'right';
          closeBtn.addEventListener('click', () => detailContainer.replaceChildren());
          card.appendChild(closeBtn);

          const heading = document.createElement('h2');
          heading.textContent = note.title;
          card.appendChild(heading);

          const meta = document.createElement('p');
          meta.className = 'description';
          const metaBits = [];
          if (note.project) metaBits.push(`project: ${note.project}`);
          if (note.tags.length > 0) metaBits.push(`tags: ${note.tags.join(', ')}`);
          metaBits.push(`created ${formatDate(note.created)}`);
          metaBits.push(`updated ${formatDate(note.updated)}`);
          meta.textContent = metaBits.join('  ·  ');
          card.appendChild(meta);

          const body = document.createElement('pre');
          body.style.cssText = 'white-space: pre-wrap; word-break: break-word; background: #171717; border: 1px solid #2a2a2a; border-radius: 8px; padding: 0.75rem; font-size: 0.9rem;';
          body.textContent = note.body;
          card.appendChild(body);
        } catch (error) {
          console.error('Failed to load note:', error);
          card.textContent = 'Failed to load note.';
        }
      }

      searchInput.addEventListener('input', renderList);
      projectFilter.addEventListener('change', renderList);

      try {
        const data = await listVaultNotes();
        notes = data.notes;

        const projects = [...new Set(notes.map((n) => n.project).filter(Boolean))].sort();
        for (const project of projects) {
          const opt = document.createElement('option');
          opt.value = project;
          opt.textContent = project;
          projectFilter.appendChild(opt);
        }

        renderList();
      } catch (error) {
        console.error('Failed to load vault notes:', error);
        listContainer.textContent = 'Failed to load vault notes.';
      }
    }
  </script>
</body>

</html>
