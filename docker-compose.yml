# docker-compose.yml
#
# For local development, just run `uv run uvicorn main:app --reload` directly.
# This file is for when you want the app running as a managed service.
#
# Usage:
#   docker compose up --build          # first run
#   docker compose up -d               # background
#   docker compose logs -f assistant   # tail logs
#
# One-time manual step after first `docker compose up`: Syncthing's device
# ID is generated per-instance, so pairing this instance with your other
# devices has to be done once via its web GUI — that GUI is deliberately
# NOT published below (see the syncthing service comments). To reach it
# for setup, either temporarily add `- "127.0.0.1:8384:8384"` to its ports
# and browse to http://localhost:8384, or SSH-tunnel to the host:
#   ssh -L 8384:localhost:8384 your-host
# and remove the temporary port mapping again once pairing is done.

services:

  assistant:
    build: .
    container_name: pa-assistant
    ports:
      - "8000:8000"
    volumes:
      # Persist SQLite and Chroma outside the container so they survive rebuilds
      - ./data/memory.db:/app/memory.db
      - ./data/reminders.db:/app/reminders.db
      - ./data/checkins.db:/app/checkins.db
      - ./data/alert_sounds.db:/app/alert_sounds.db
      - ./data/alert_sounds:/app/alert_sounds
      - ./data/chroma_db:/app/chroma_db
      # The notes vault — shared with the syncthing service below so both
      # containers see the same files. Must match VAULT_PATH in .env.
      - ./data/vault:/app/vault
      # Raw voice recordings (see voice.py's UPLOAD_DIR) — without this
      # they vanish on every container recreation. jobs/digest.py's nightly
      # sweep prunes anything older than 24h, so this shouldn't grow large.
      - ./received_notes:/app/received_notes
    env_file:
      # Loads .env.docker specifically — NOT .env. These are separate files
      # that must be kept in sync by hand (e.g. VAULT_PATH legitimately
      # differs between local dev and this container). Updating a secret in
      # .env alone does not affect what this container runs with.
      - .env.docker
    restart: unless-stopped
    depends_on:
      - syncthing
      - caldav

  # Bundled CalDAV server (Radicale) for the calendar integration
  # (utils/caldav_client.py). Batteries-included default — point CALDAV_URL
  # elsewhere (an existing Nextcloud/Baikal/Fastmail calendar) and skip this
  # service entirely if you'd rather not run it.
  #
  # Fully self-provisioning: no manual setup step needed for a fresh clone
  # beyond setting CALDAV_USERNAME/CALDAV_PASSWORD below (same as any other
  # secret in .env.docker). The entrypoint override writes Radicale's config
  # + htpasswd users file from those two vars on every startup (idempotent —
  # harmless to rewrite each time, and never touches the actual calendar
  # data in /data), then chains into the image's real entrypoint so its own
  # UID/GID handling and privilege drop to the `radicale` user still happen
  # normally. The calendar collection itself is created automatically by
  # `assistant` at its own startup (utils/caldav_client.py's
  # ensure_collection_exists(), via MKCALENDAR) — also no manual step.
  caldav:
    image: tomsquest/docker-radicale:latest  # TODO: verify/pin a specific tag before first run
    container_name: pa-caldav
    env_file:
      # Same file as `assistant` — CALDAV_USERNAME/CALDAV_PASSWORD feed the
      # entrypoint override below directly.
      - .env.docker
    volumes:
      - ./data/radicale/config:/config
      # Actual calendar storage (.ics files on disk). Unrelated to the
      # vault/Syncthing volumes above — deliberately not shared with them.
      - ./data/radicale/data:/data
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        mkdir -p /config /data/collections
        printf '%s\n' \
          '[server]' \
          'hosts = 0.0.0.0:5232' \
          '' \
          '[auth]' \
          'type = htpasswd' \
          'htpasswd_filename = /config/users' \
          'htpasswd_encryption = plain' \
          '' \
          '[storage]' \
          'filesystem_folder = /data/collections' \
          '' \
          '[rights]' \
          'type = owner_only' \
          '' \
          '[web]' \
          'type = internal' \
          > /config/config
        printf '%s:%s\n' "$$CALDAV_USERNAME" "$$CALDAV_PASSWORD" > /config/users
        exec /usr/local/bin/docker-entrypoint.sh /venv/bin/radicale --config /config/config
    # Not published by default — reachable internally by `assistant` over
    # the compose network at http://caldav:5232. The dashboard's
    # /calendar proxy (routes/calendar_proxy.py) reaches Radicale that way
    # too, for its collection-management UI (create/rename/delete a
    # calendar) — Radicale has no event-viewing UI at all, so seeing/
    # editing events needs a real CalDAV client pointed at Radicale
    # directly, which is what this port is for. Uncomment to expose 5232
    # and point a native calendar app (phone/DAVx5, Thunderbird, desktop
    # calendar) at it with its own htpasswd credentials — a separate trust
    # boundary from the dashboard's session/API_TOKEN auth, same treatment
    # as Syncthing's GUI port below.
    ports:
      - "5232:5232"
    restart: unless-stopped

  syncthing:
    image: syncthing/syncthing:latest
    container_name: pa-syncthing
    hostname: pa-syncthing
    environment:
      # Match these to the UID/GID that owns ./data on the host (`id -u`,
      # `id -g`) so the assistant container (running as its own user) and
      # Syncthing don't fight over file ownership in the shared vault.
      - PUID=1000
      - PGID=1000
    volumes:
      - ./data/syncthing-config:/var/syncthing/config
      # Same host path as the assistant service's vault mount above —
      # this is what makes it a *shared* volume between the two containers.
      - ./data/vault:/var/syncthing/vault
    ports:
      # Sync protocol — needs to be reachable from your other devices for
      # them to actually sync with this instance.
      - "22000:22000/tcp"
      - "22000:22000/udp"
      #- "21027:21027/udp"  # local discovery
      #- "8384:8384"
      # Deliberately NOT publishing 8384 (the web GUI) here. By default
      # Syncthing only binds its GUI to localhost *inside* the container,
      # so leaving this unpublished means it isn't reachable from the
      # network at all — see the one-time setup note above for how to
      # reach it when you actually need to pair a device.
    restart: unless-stopped
